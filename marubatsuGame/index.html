<!DOCTYPE html>
<html lang="ja">
    <head>

            <div class="container">
                <div class="tools">
                    <p class="messeage_display" id ="tools_nowPlayer"> ● のターン</p>

                <div class="playing_board_container">
                    <div class="playing_board">
                        <div class="playing_board_row">
                            <input type="button" class="playing_board_cell" id="cell_1"  />
                            <input type="button" class="playing_board_cell" id="cell_2" />
                            <input type="button" class="playing_board_cell" id="cell_3"/>
                        </div>
                        <div class="playing_board_row">
                            <input type="button" class="playing_board_cell" id="cell_4"/>
                            <input type="button" class="playing_board_cell" id="cell_5"/>
                            <input type="button" class="playing_board_cell" id="cell_6" />
                        </div>
                        <div class="playing_board_row">
                            <input type="button" class="playing_board_cell" id="cell_7"/>
                            <input type="button" class="playing_board_cell" id="cell_8"/>
                            <input type="button" class="playing_board_cell" id="cell_9"/>
                        </div>
                   </div> 
                </div>
            </div>
        </main>
        <footer class="copyright_container">
            <p class="copyright">© 2025 team_marubatsu</p>
